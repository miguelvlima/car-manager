services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-carmanager}
    volumes:
      - car_manager_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carmanager} -d ${POSTGRES_DB:-carmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-carmanager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carmanager}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?defina AUTH_URL}
      AUTH_TRUST_HOST: "true"
      STORAGE_DRIVER: local
      UPLOAD_DIR: ./uploads
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
    volumes:
      - car_manager_uploads:/app/uploads

volumes:
  car_manager_pg:
  car_manager_uploads:
